name: "Machbar"
description: "GTD task management for families and teams. Manage projects, tasks, and agendas with per-member contexts."
version: "0.1.0"
slug: "machbar"
url: "https://github.com/temporaer/machbar"

# Set to false: we provide our own init via the run script
init: false

arch:
  - aarch64
  - amd64
  - armhf
  - armv7

startup: services
boot: auto

# Expose the port for direct access (null = disabled by default; use ingress instead)
ports:
  3000/tcp: null

# Ingress — HA proxies the UI through its own dashboard without exposing a port
ingress: true
ingress_port: 3000
panel_icon: "mdi:check-all"
panel_title: "Machbar"

options:
  seed_database: false

schema:
  seed_database: bool
