services:
  machbar:
    build: .
    restart: unless-stopped
    # MACHBAR_PORT on the host (default 3000); container always listens on 3000
    ports:
      - "127.0.0.1:${MACHBAR_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      DATABASE_FILE: machbar.db
      BASE_PATH: /
      SEED_DATABASE: "false"
      NODE_ENV: production
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:?OIDC_ISSUER_URL is required}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:?OIDC_CLIENT_ID is required}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}"
      OIDC_PUBLIC_URL: "${OIDC_PUBLIC_URL:?OIDC_PUBLIC_URL is required}"
      OIDC_SESSION_TTL_DAYS: "${OIDC_SESSION_TTL_DAYS:-30}"
    volumes:
      - machbar-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  machbar-data:
