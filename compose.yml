services:
  machbar:
    build: .
    restart: unless-stopped
    # Bind to host loopback by default; containerized reverse proxies can opt
    # into a LAN-facing host address with MACHBAR_BIND_ADDRESS.
    ports:
      - "${MACHBAR_BIND_ADDRESS:-127.0.0.1}:${MACHBAR_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATA_DIR: /data
      DATABASE_FILE: machbar.db
      BASE_PATH: /
      SEED_DATABASE: "false"
      NODE_ENV: production
      ALLOW_UNAUTHENTICATED: "${ALLOW_UNAUTHENTICATED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_PUBLIC_URL: "${OIDC_PUBLIC_URL:-}"
      OIDC_SESSION_TTL_DAYS: "${OIDC_SESSION_TTL_DAYS:-30}"
      VAPID_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
      VAPID_PRIVATE_KEY: "${VAPID_PRIVATE_KEY:-}"
      VAPID_SUBJECT: "${VAPID_SUBJECT:-}"
      PAPERLESS_URL: "${PAPERLESS_URL:-}"
      PAPERLESS_API_TOKEN: "${PAPERLESS_API_TOKEN:-}"
    volumes:
      - machbar-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

volumes:
  machbar-data:
