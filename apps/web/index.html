<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#146356" />
    <script>
      (() => {
        const storageKey = "machbar:theme";
        const darkQuery = "(prefers-color-scheme: dark)";
        const themeColors = { light: "#146356", dark: "#101815" };
        let preference = "system";

        try {
          const stored = localStorage.getItem(storageKey);
          if (stored === "light" || stored === "dark" || stored === "system") {
            preference = stored;
          }
        } catch {
          // Keep the system default when browser storage is unavailable.
        }

        let systemTheme = "light";
        try {
          systemTheme = window.matchMedia(darkQuery).matches ? "dark" : "light";
        } catch {
          // Light is the safe fallback in browsers without matchMedia.
        }

        const theme = preference === "system" ? systemTheme : preference;
        const root = document.documentElement;
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = themeColors[theme];
      })();
    </script>
    <title>Machbar</title>
    <meta name="description" content="Machbar – Das ist machbar." />
    <link rel="manifest" href="./manifest.de.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <script>
      (() => {
        const supported = new Set(["de", "en"]);
        let locale = null;
        try {
          const stored = localStorage.getItem("machbar:locale");
          if (supported.has(stored)) locale = stored;
        } catch {
          // Browser language detection remains available without storage.
        }
        if (!locale) {
          const languages =
            navigator.languages && navigator.languages.length > 0
              ? navigator.languages
              : [navigator.language];
          locale =
            languages
              .filter((language) => typeof language === "string")
              .map((language) => language.trim().toLowerCase().split("-")[0])
              .find((language) => supported.has(language)) || "de";
        }

        const metadata = {
          de: {
            title: "Machbar",
            description: "Machbar – Das ist machbar.",
          },
          en: {
            title: "Machbar",
            description: "Machbar – We can do this.",
          },
        }[locale];

        document.documentElement.lang = locale;
        document.title = metadata.title;
        document.querySelector('meta[name="description"]').content =
          metadata.description;
        document.querySelector('link[rel="manifest"]').href =
          `./manifest.${locale}.webmanifest`;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
