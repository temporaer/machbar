sync_task:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: machbar
    source_key:
      required: true
      selector:
        template:
    occurrence_key:
      name: Routine occurrence key
      description: "Optional: source_key identifies the routine, occurrence_key its week/event (e.g. 2026-W46), scheduled_date the actual execution day. Retains open work and creates new tasks without reopening history. Update server first."
      selector:
        text:
    relevant:
      required: true
      selector:
        boolean:
    title:
      selector:
        text:
    person:
      selector:
        entity:
          domain: person
    scheduled_date:
      selector:
        date:
    due_date:
      selector:
        date:
    revisit_at:
      selector:
        text:
    not_before_at:
      selector:
        text:
    not_before_date:
      selector:
        date:
    notes:
      selector:
        text:
          multiline: true
    reactivate_completed:
      selector:
        boolean:
    overwrite_notes:
      selector:
        boolean:
    deadline_reminder:
      selector:
        object:
    deadline_reminders:
      selector:
        object:
    priority:
      selector:
        number:
          min: 1
          max: 5
          step: 1
          mode: slider
    size:
      selector:
        select:
          options:
            - S
            - M
            - L
            - XL
