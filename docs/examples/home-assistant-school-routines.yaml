script:
  machbar_lars_schulroutine:
    alias: Machbar – Lars Schulroutine
    description: Ferienbewusste Wochenroutinen. Wochenplan am ersten Schultag der
      ISO-Woche; Schulpost freitags. Nur heute, 16–20 Uhr; keine Nachanlage vergangener
      Wochen. Benötigt Machbar API 0.27.0 und HA-Komponente 0.9.0. Testlauf ohne Schreiben
      mit dry_run=true.
    mode: queued
    max: 10
    fields:
      routine:
        required: true
        selector:
          select:
            options:
            - value: weekplan
              label: Wochenplan
            - value: mailbags
              label: Schulpost und Beutel
      dry_run:
        default: true
        selector:
          boolean: {}
    sequence:
    - variables:
        routines:
          weekplan:
            key: school:lars:weekplan
            title: 'Lars: Wochenplan und Hausaufgabenheft prüfen'
            notes: Wochenplan lesen, Arbeitsblätter in rote/blaue Hefter einsortieren,
              Hausaufgabenheft kontrollieren.
          mailbags:
            key: school:lars:mailbags
            title: 'Lars: Schulpost und Sport-/Schwimmbeutel prüfen'
            notes: Postmappe leeren, Mitteilungen bearbeiten, Sport- und Schwimmbeutel
              nach Hause holen.
        preview: '{{ dry_run | default(true) | bool }}'
        today: '{{ now().date().isoformat() }}'
        week: '{{ now().strftime(''%G-W%V'') }}'
    - if:
      - condition: template
        value_template: '{{ routine is not defined or routine not in routines }}'
      then:
      - stop: Unbekannte Schulroutine
        error: true
    - variables:
        selected: '{{ routines[routine] }}'
    - if:
      - condition: template
        value_template: '{{ now().weekday() > 4 or (routine == ''mailbags'' and now().weekday()
          != 4) or (not preview and (now().hour < 16 or now().hour >= 20)) }}'
      then:
      - variables:
          result:
            outcome: skipped
            reason: outside_execution_window
            scheduled_date: '{{ today }}'
      - stop: Außerhalb des heutigen Ausführungsfensters
        response_variable: result
    - variables:
        vacation: '{{ states(''sensor.schulferien_de_bw'') }}'
        holiday: '{{ states(''sensor.feiertag_de_bw'') }}'
        combined: '{{ states(''binary_sensor.schulferien_feiertage_de_bw'') }}'
        workday: '{{ states(''binary_sensor.workday_sensor'') }}'
    - if:
      - condition: template
        value_template: '{{ vacation not in [''ferientag'',''kein_ferientag''] or
          holiday not in [''feiertag'',''kein_feiertag''] or combined not in [''on'',''off'']
          or workday not in [''on'',''off''] }}'
      then:
      - action: system_log.write
        data:
          level: error
          logger: machbar.school_routines
          message: 'Schulroutine {{ routine }} gesperrt: Ferien={{ vacation }}, Feiertag={{
            holiday }}, kombiniert={{ combined }}, Workday={{ workday }}; Quellen
            unbekannt oder nicht erreichbar.'
      - stop: Ferien-/Feiertagsdaten unbekannt oder nicht erreichbar
        error: true
    - if:
      - condition: or
        conditions:
        - condition: state
          entity_id: sensor.schulferien_de_bw
          state: ferientag
        - condition: state
          entity_id: sensor.feiertag_de_bw
          state: feiertag
        - condition: state
          entity_id: binary_sensor.schulferien_feiertage_de_bw
          state: 'on'
        - condition: state
          entity_id: binary_sensor.workday_sensor
          state: 'off'
      then:
      - variables:
          result:
            outcome: skipped
            reason: no_school_day
            scheduled_date: '{{ today }}'
      - stop: Kein Schultag laut vorhandenen BW-Daten
        response_variable: result
    - variables:
        sync_data:
          config_entry_id: replace-with-existing-machbar-config-entry-id
          source_key: '{{ selected.key }}'
          occurrence_key: '{{ week }}'
          relevant: true
          title: '{{ selected.title }}'
          notes: '{{ selected.notes }}'
          scheduled_date: '{{ today }}'
    - if:
      - condition: template
        value_template: '{{ preview }}'
      then:
      - variables:
          result:
            outcome: would_sync
            data: '{{ sync_data }}'
      - stop: 'Testlauf: kein Machbar-Aufruf'
        response_variable: result
    - action: machbar.sync_task
      data: '{{ sync_data }}'
    - variables:
        result:
          outcome: synced
          source_key: '{{ selected.key }}'
          occurrence_key: '{{ week }}'
          scheduled_date: '{{ today }}'
    - stop: Schulroutine in Machbar sichergestellt
      response_variable: result
automation:
- alias: Machbar – Lars Wochenplan am ersten Schultag
  description: Europe/Berlin. Ausführung ab 16 Uhr, Wiederholung bis 20 Uhr und beim
    HA-Start. Nur aktueller Tag, keine vergangenen Wochen; ISO-Wochenschlüssel verhindert
    doppelte Instanzen. Erst nach Server- und HA-Komponentenupdate aktivieren.
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  conditions:
  - condition: time
    after: '15:59:59'
    before: '20:00:00'
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  actions:
  - action: script.machbar_lars_schulroutine
    data:
      routine: weekplan
      dry_run: false
  mode: single
  trace:
    stored_traces: 20
- alias: Machbar – Lars Schulpost und Beutel
  description: Europe/Berlin. Ausführung ab 16 Uhr, Wiederholung bis 20 Uhr und beim
    HA-Start. Nur aktueller Tag, keine vergangenen Wochen; ISO-Wochenschlüssel verhindert
    doppelte Instanzen. Erst nach Server- und HA-Komponentenupdate aktivieren.
  triggers:
  - trigger: time_pattern
    minutes: /15
  - trigger: homeassistant
    event: start
  conditions:
  - condition: time
    after: '15:59:59'
    before: '20:00:00'
    weekday:
    - fri
  actions:
  - action: script.machbar_lars_schulroutine
    data:
      routine: mailbags
      dry_run: false
  mode: single
  trace:
    stored_traces: 20
