name: Codex address review feedback

# Outer-loop glue: when a reviewer requests changes (or someone mentions
# @codex on a PR), Codex addresses the feedback, the change is verified with
# scripts/verify.sh, and only a green commit is pushed back to the PR branch.
# See AGENTS.md ("Running the loop") and docs/loop-engineering.md.

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Least privilege by default; the job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: codex-address-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  address-review:
    name: address-review
    # Guardrails:
    # - Human review feedback (changes requested / commented) auto-triggers.
    # - An on-demand "@codex" mention on a PR (issue or review comment) triggers.
    # - Fork PRs are rejected inside the job to avoid exposing secrets.
    # - The Codex Action additionally enforces that the triggering actor has
    #   write access (see allow-users / allow-bots).
    if: >-
      ${{
        (github.event_name == 'pull_request_review' &&
          (github.event.review.state == 'changes_requested' ||
           github.event.review.state == 'commented'))
        ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request != null &&
          contains(github.event.comment.body, '@codex'))
        ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@codex'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      # Bounded fix/verify attempts, mirroring the iteration cap in AGENTS.md.
      MAX_VERIFY_ATTEMPTS: "2"
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve PR branch and reject forks
        id: prep
        run: |
          set -euo pipefail
          read -r branch cross < <(
            gh pr view "$PR_NUMBER" \
              --json headRefName,isCrossRepository \
              -q '[.headRefName, (.isCrossRepository|tostring)] | @tsv'
          )
          if [ "$cross" = "true" ]; then
            echo "PR #$PR_NUMBER is from a fork; skipping to protect secrets."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Check out PR branch
        if: steps.prep.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.prep.outputs.branch }}"
          git checkout -B "${{ steps.prep.outputs.branch }}" "origin/${{ steps.prep.outputs.branch }}"

      - name: Collect review feedback for Codex
        if: steps.prep.outputs.skip != 'true'
        run: |
          set -euo pipefail
          mkdir -p .codex-review
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/reviews" \
            > .codex-review/reviews.json || echo '[]' > .codex-review/reviews.json
          gh api --paginate "repos/${{ github.repository }}/pulls/${PR_NUMBER}/comments" \
            > .codex-review/line-comments.json || echo '[]' > .codex-review/line-comments.json

      # Dependencies must be installed before the Codex step: the :workspace
      # permission profile does not grant network access.
      - name: Set up Node.js
        if: steps.prep.outputs.skip != 'true'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        if: steps.prep.outputs.skip != 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.prep.outputs.skip != 'true'
        run: bash scripts/codex-setup.sh

      - name: Address review feedback with Codex
        id: codex
        if: steps.prep.outputs.skip != 'true'
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          output-file: codex-output.md
          prompt: |
            You are addressing reviewer feedback on pull request #${{ env.PR_NUMBER }}
            of ${{ github.repository }} (branch ${{ steps.prep.outputs.branch }}).

            Read the review feedback captured in the repository:
            - .codex-review/reviews.json (submitted reviews and their bodies)
            - .codex-review/line-comments.json (inline review comments with file/line)

            The comment that triggered this run (may be empty):
            ----
            ${{ github.event.review.body }}
            ${{ github.event.comment.body }}
            ----

            Make the minimal code changes needed to address the actionable
            feedback. Do not change unrelated code and do not widen scope.
            Follow AGENTS.md and docs/architecture-rules.md: keep one canonical
            mutation path per operation, avoid speculative abstractions, and
            prefer behavioral/invariant tests.

            Do NOT commit, push, or create files outside the normal source tree.
            The workflow runs `bash scripts/verify.sh` after you finish and only
            pushes if it is green.

      - name: Verify and push only green changes
        if: steps.prep.outputs.skip != 'true'
        run: |
          set -uo pipefail
          # Drop Codex scratch artifacts so they never get committed.
          rm -rf .codex-review codex-output.md

          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex made no changes; nothing to verify or push."
            exit 0
          fi

          attempt=1
          verified=false
          while [ "$attempt" -le "${MAX_VERIFY_ATTEMPTS}" ]; do
            echo "::group::verify attempt ${attempt}/${MAX_VERIFY_ATTEMPTS}"
            if bash scripts/verify.sh; then
              verified=true
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done

          if [ "$verified" != "true" ]; then
            gh pr comment "$PR_NUMBER" --body \
              "🤖 Codex addressed review feedback, but \`scripts/verify.sh\` is still failing after ${MAX_VERIFY_ATTEMPTS} attempts. Not pushing — a human should take a look (see the iteration cap in AGENTS.md)."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: address review feedback via Codex

          Co-authored-by: openai-codex[bot] <codex@openai.com>"
          git push origin "HEAD:${{ steps.prep.outputs.branch }}"
          gh pr comment "$PR_NUMBER" --body \
            "🤖 Codex addressed review feedback and pushed a verified (green) commit."
