name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run architecture
      # Workspace consumers resolve @machbar/shared from its generated dist.
      - run: npm run build -w @machbar/shared
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m pytest
