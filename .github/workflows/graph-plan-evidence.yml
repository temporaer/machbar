name: Graph query plan evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @machbar/shared
      - name: Capture compact plan evidence
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_SIZES=5000 AUDIT_REPEATS=1 AUDIT_SHAPES=balanced npx tsx apps/api/scripts/graph-load-profile.ts > /tmp/profile.json
          node -e '
            const fs = require("node:fs");
            const result = JSON.parse(fs.readFileSync("/tmp/profile.json", "utf8")).results[0].result;
            const plans = new Map(result.queryPlans.map((entry) => [entry.sql, entry]));
            const evidence = result.statements.slice(0, 4).map((statement) => ({
              elapsedMs: statement.elapsedMs,
              rows: statement.rowsReturnedOrChanged,
              ctes: statement.ctes,
              sql: statement.sql.slice(0, 180),
              plan: plans.get(statement.sql)?.plan.map((row) => row.detail) ?? [],\n              explainError: plans.get(statement.sql)?.explainError ?? null
            }));
            console.log("PLAN_EVIDENCE " + JSON.stringify(evidence));
          '
