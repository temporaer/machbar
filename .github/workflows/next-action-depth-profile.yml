name: Next action depth profile

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @machbar/shared
      - name: Measure fixed-size fixtures at controlled depths
        shell: bash
        run: |
          set -euo pipefail
          AUDIT_SIZES=1000 AUDIT_REPEATS=1 AUDIT_CASE_TIMEOUT_MS=90000 AUDIT_SHAPES=deep-chain AUDIT_DEPTHS=1,2,4,8,16,32,64,128,256,512,1000 npx tsx apps/api/scripts/graph-load-profile.ts > /tmp/depth-profile.json
          node -e '
            const fs = require("node:fs");
            const data = JSON.parse(fs.readFileSync("/tmp/depth-profile.json", "utf8"));
            for (const { fixture, result } of data.results) {
              const plans = new Map(result.queryPlans.map((item) => [item.sql, item]));
              const top = result.statements.slice(0, 3).map((statement) => ({
                ms: statement.elapsedMs,
                rows: statement.rowsReturnedOrChanged,
                ctes: statement.ctes,
                explainError: plans.get(statement.sql)?.explainError ?? null,
                plan: plans.get(statement.sql)?.plan.map((row) => row.detail) ?? []
              }));
              console.log("DEPTH_RESULT " + JSON.stringify({
                maxHierarchyDepth: fixture.maxHierarchyDepth,
                status: result.status,
                wallMs: result.totals.wallMs,
                sqlMs: result.totals.sqlMs,
                failures: result.failures,
                top
              }));
            }
          '
      - uses: actions/upload-artifact@v4
        with:
          name: next-action-depth-profile
          path: /tmp/depth-profile.json
          retention-days: 7
